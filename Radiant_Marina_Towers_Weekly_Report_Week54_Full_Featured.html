            const series = c.series || [],
               cats = c.categories || [],

            const ns = "http://www.w3.org/2000/svg";
            function S(tag, a = {}, text) {
               let x = document.createElementNS(ns, tag);

                  "Total",
               );
               cats.forEach((cat, i) => {
                  let y = 45 + i * 23;
                  S("rect", {
                     x: 510,
                     y: y - 10,
                     width: 11,
                     height: 11,
                     rx: 2,
                     fill: palette[i % palette.length],
                  });
                  S(
                     "text",
                     { x: 529, y, "font-size": 12, fill: "#4c5670" },
                     String(cat).slice(0, 48),
                  );
                  S(
                     "text",
                     {
                        x: 900,
                        y,
                        "font-size": 12,
                        fill: "#273354",
                        "text-anchor": "end",
                     },
                     fmt(numbers[i]),
                  );
               });
            } else if (typ.includes("line")) {
               let dates = series.flatMap((s) =>
                  (s.data || []).map((d, i) =>
                     d && typeof d === "object" ? d.x || i : cats[i] || i,
                  ),
               );
               let xvals = [...new Set(dates.map(String))].sort();
               if (!xvals.length) xvals = cats.map(String);
               let max = Math.max(
                     1,
                     ...series
                        .flatMap((s) => (s.data || []).map(val))
                        .filter(Number.isFinite),
                  ),
                  min = Math.min(
                     0,
                     ...series
                        .flatMap((s) => (s.data || []).map(val))
                        .filter(Number.isFinite),
                  );
               let x = (i) =>
                     L + ((W - L - R) * i) / Math.max(1, xvals.length - 1),
                  y = (v) =>
                     T + (H - T - B) * (1 - (v - min) / Math.max(1, max - min));
               for (let k = 0; k <= 4; k++) {
                  let n = min + ((max - min) * k) / 4,
                     yy = y(n);
                  S("line", {
                     x1: L,
                     x2: W - R,
                     y1: yy,
                     y2: yy,
                     stroke: "#e7eaf2",
                  });
                  S(
                     "text",
                     {
                        x: L - 7,
                        y: yy + 4,
                        "text-anchor": "end",
                        "font-size": 11,
                        fill: "#77849a",
                     },
                     fmt(Number(n.toFixed(2))),
                  );
               }
               series.forEach((s, si) => {
                  let points = [];
                  const arr = s.data || [];
                  arr.forEach((d, i) => {
                     let xx =
                           d && typeof d === "object" ? d.x || i : cats[i] || i,
                        v = val(d),
                        idx = xvals.indexOf(String(xx));
                     if (v === null || !Number.isFinite(v) || idx < 0) {
                        if (points.length > 1)
                           S("polyline", {
                              points: points.join(" "),
                              fill: "none",
                              stroke: color(s, si),
                              "stroke-width": 2.5,
                           });
                        points = [];
                        return;
                     }
                     let px = x(idx),
                        py = y(v);
                     points.push(`${px},${py}`);
                     let pt = S("circle", {
                        cx: px,
                        cy: py,
                        r: 2.5,
                        fill: color(s, si),
                     });
                     add(
                        pt,
                        (() => {
                           let tt = document.createElementNS(ns, "title");
                           tt.textContent = `${s.name}: ${fmt(v)} · ${xx}`;
                           return tt;
                        })(),
                     );
                  });
                  if (points.length > 1)
                     S("polyline", {
                        points: points.join(" "),
                        fill: "none",
                        stroke: color(s, si),
                        "stroke-width": 2.5,
                     });
               });
               let count = Math.min(7, xvals.length);
               for (let j = 0; j < count; j++) {
                  let idx = Math.round(
                     (j * (xvals.length - 1)) / Math.max(1, count - 1),
                  );
                  S(
                     "text",
                     {
                        x: x(idx),
                        y: H - 18,
                        "text-anchor": "middle",
                        "font-size": 10,
                        fill: "#748198",
                     },
                     String(xvals[idx]).slice(0, 13),
                  );
               }
            } else {
               let n = Math.max(
                     cats.length,
                     ...series.map((s) => (s.data || []).length),
                  ),
                  max = Math.max(
                     1,
                     ...series
                        .flatMap((s) => (s.data || []).map(val))
                        .filter(Number.isFinite),
                  ),
                  min = Math.min(
                     0,
                     ...series
                        .flatMap((s) => (s.data || []).map(val))
                        .filter(Number.isFinite),
                  );
               if (max === min) max++;
               let y = (v) => T + (H - T - B) * (1 - (v - min) / (max - min)),
                  group = (W - L - R) / Math.max(1, n),
                  bw = Math.max(
                     3,
                     Math.min(35, (group * 0.77) / Math.max(1, series.length)),
                  );
               for (let k = 0; k <= 4; k++) {
                  let v = min + ((max - min) * k) / 4,
                     yy = y(v);
                  S("line", {
                     x1: L,
                     x2: W - R,
                     y1: yy,
                     y2: yy,
                     stroke: "#e7eaf2",
                  });
                  S(
                     "text",
                     {
                        x: L - 7,
                        y: yy + 4,
                        "text-anchor": "end",
                        "font-size": 10,
                        fill: "#748198",
                     },
                     fmt(Number(v.toFixed(2))),
                  );
               }
               for (let i = 0; i < n; i++) {
                  if (i % Math.max(1, Math.ceil(n / 12)) === 0) {
                     let label = String(cats[i] || i + 1);
                     S(
                        "text",
                        {
                           x: L + group * (i + 0.5),
                           y: H - 25,
                           "text-anchor": "middle",
                           "font-size": 10,
                           fill: "#6d7992",
                        },
                        label.length > 14 ? label.slice(0, 12) + "…" : label,
                     );
                  }
                  series.forEach((s, si) => {
                     let v = val((s.data || [])[i]);
                     if (v === null || !Number.isFinite(v)) return;
                     let h = Math.abs(y(v) - y(0)),
                        xx =
                           L +
                           group * (i + 0.5) -
                           (series.length * bw) / 2 +
                           si * bw,
                        yy = v >= 0 ? y(v) : y(0);
                     let rect = S("rect", {
                        x: xx,
                        y: yy,
                        width: Math.max(2, bw - 2),
                        height: Math.max(1, h),
                        rx: 2,
                        fill: color(s, si),
                     });
                     let t = document.createElementNS(ns, "title");
                     t.textContent = `${s.name} · ${cats[i] || i + 1}: ${fmt(v)}`;
                     rect.appendChild(t);
                  });
               }
            }
            const legend = add(wrap, el("div", "legend"));
            series.forEach((s, i) => {
               let a = add(legend, el("span"));
               let d = add(a, el("i", "dot"));
               d.style.background = typ.includes("donut")
                  ? palette[i % palette.length]
                  : color(s, i);
               a.appendChild(
                  document.createTextNode(s.name || `Series ${i + 1}`),
               );
            });
            if (c.qualification) txt(wrap, c.qualification, "qual");
         }
         function table(p, c, index) {
            const wrap = add(p, el("div", "block"));
            const head = add(wrap, el("div", "table-head"));
            add(head, el("h4", "", c.title || "Data register"));
            const sr = add(head, el("input", "tablesearch"));
            sr.placeholder = "Filter table";
            const rows = Array.isArray(c.rows) ? c.rows : [],
               cols =
                  Array.isArray(c.columns) && c.columns.length
                     ? c.columns.map((x) => ({
                          key: x.key,
                          label: x.label || x.key,
                       }))
                     : Object.keys(rows[0] || {}).map((k) => ({
                          key: k,
                          label: k.replace(/_/g, " "),
                       }));
            const holder = add(wrap, el("div", "tablewrap"));
            const tbl = add(holder, el("table")),
               thead = add(tbl, el("thead")),
               tr = add(thead, el("tr")),
               tbody = add(tbl, el("tbody"));
            let key = null,
               asc = true;
            cols.forEach((col) => {
               let th = add(tr, el("th", "", col.label));
               th.title = "Sort by " + col.label;
               th.onclick = () => {
                  asc = key === col.key ? !asc : true;
                  key = col.key;
                  render();
               };
            });
            const foot = add(wrap, el("div", "count"));
            function render() {
               let q = sr.value.trim().toLowerCase(),
                  filtered = rows.filter(
                     (r) =>
                        !q ||
                        cols.some((col) =>
                           fmt(r[col.key]).toLowerCase().includes(q),
                        ),
                  );
               if (key)
                  filtered.sort((a, b) => {
                     let x = a[key],
                        y = b[key];
                     return (
                        (typeof x === "number" && typeof y === "number"
                           ? x - y
                           : String(x ?? "").localeCompare(
                                String(y ?? ""),
                                undefined,
                                { numeric: true },
                             )) * (asc ? 1 : -1)
                     );
                  });
               tbody.replaceChildren();
               const frag = document.createDocumentFragment();
               filtered.forEach((r) => {
                  const row = el("tr");
                  cols.forEach((col) => {
                     let td = add(row, el("td", "", fmt(r[col.key])));
                     if (String(r[col.key] ?? "").length > 140)
                        td.title = fmt(r[col.key]);
                  });
                  frag.appendChild(row);
               });
               tbody.appendChild(frag);
               foot.textContent = `Showing ${filtered.length} of ${rows.length} records`;
            }
            sr.oninput = render;
            render();
            if (c.footer_note) txt(wrap, c.footer_note, "qual");
         }
         function renderBlock(p, b) {
            const c = b.content || {},
               t = b.type;
            let x;
            if (t === "paragraph") {
               x = add(p, el("div", "block"));
               add(x, el("p", "", c.text || ""));
            } else if (t === "heading") {
               add(
                  p,
                  el((c.level || 2) <= 2 ? "h3" : "h4", "block", c.text || ""),
               );
            } else if (t === "kpi_cards") {
               x = add(p, el("div", "kpis block"));
               (c.cards || []).forEach((k) => {
                  let kpi = add(x, el("div", "kpi " + (k.status || "")));
                  add(kpi, el("div", "label", k.label || ""));
                  let line = add(kpi, el("div", "val", fmt(k.value)));
                  if (k.unit) add(line, el("span", "unit", k.unit));
                  if (
                     k.comparison_value !== null &&
                     k.comparison_value !== undefined
                  )
                     txt(
                        kpi,
                        (k.comparison_label || "Comparison") +
                           ": " +
                           fmt(k.comparison_value),
                        "qual",
                     );
                  if (k.qualification) txt(kpi, k.qualification, "qual");
               });
            } else if (t === "chart") chart(p, c);
            else if (t.endsWith("table")) table(p, c, b.block_id);
            else if (t === "progress_bar") {
               x = add(p, el("div", "block"));
               txt(x, c.label || "Progress");
               let sh = add(x, el("div", "progress-shell"));
               let pl = add(sh, el("div", "progress-plan"));
               pl.style.width =
                  Math.min(100, Math.max(0, Number(c.planned_percent) || 0)) +
                  "%";
               let ac = add(sh, el("div", "progress-actual"));
               ac.style.width =
                  Math.min(100, Math.max(0, Number(c.actual_percent) || 0)) +
                  "%";
               txt(
                  x,
                  `Planned ${fmt(c.planned_percent)}% · Actual ${fmt(c.actual_percent)}%`,
                  "qual",
               );
               if (c.qualification) txt(x, c.qualification, "qual");
            } else if (t === "callout" || t === "finding") {
               x = add(
                  p,
                  el(
                     "div",
                     (t === "finding" ? "finding" : "callout") +
                        " block " +
                        (c.severity || ""),
                  ),
               );
               if (c.title) add(x, el("h4", "", c.title));
               txt(x, c.text || "");
            } else if (t === "bullet_list" || t === "numbered_list") {
               x = add(
                  p,
                  el(t === "bullet_list" ? "ul" : "ol", "bullets block"),
               );
               (c.items || []).forEach((v) =>
                  add(
                     x,
                     el("li", "", typeof v === "string" ? v : v.text || ""),
                  ),
               );
            } else if (t === "timeline") {
               x = add(p, el("div", "timeline block"));
               (c.items || []).forEach((a) => {
                  let y = add(x, el("div", "event"));
                  if (a.date) add(y, el("time", "", a.date));
                  add(y, el("b", "", a.label || ""));
                  if (a.description) txt(y, a.description);
               });
            } else if (t === "image") {
               x = add(p, el("figure", "block"));
               if (c.image_url && /^https:\/\//.test(c.image_url)) {
                  let img = add(x, el("img", "photo"));
                  img.src = c.image_url;
                  img.alt =
                     "Source progress photograph " + (c.image_reference || "");
                  img.loading = "lazy";
                  img.onerror = () => {
                     img.style.display = "none";
                     txt(
                        x,
                        "Photograph could not be loaded from the source URL.",
                        "empty",
                     );
                  };
               } else {
                  txt(x, "Photograph URL unavailable", "empty");
               }
               add(
                  x,
                  el(
                     "figcaption",
                     "qual",
                     `Reference: ${fmt(c.image_reference)} · Photo date: ${fmt(c.photo_date)} · Location: ${fmt(c.work_area)}`,
                  ),
               );
            } else {
               let box = add(p, el("div", "block"));
               txt(box, `Additional AST block (${t})`, "qual");
               txt(box, JSON.stringify(c), "qual");
            }
         }
         function build() {
            let root = document.getElementById("report"),
               nav = document.getElementById("navlinks");
            const cover = add(root, el("header", "cover"));
            cover.id = "cover";
            add(
               cover,
               el(
                  "div",
                  "eyebrow",
                  "CONSTRUCTION PROJECT CONTROLS · WEEKLY REPORT",
               ),
            );
            add(cover, el("h1", "", "RADIANT MARINA TOWERS"));
            add(cover, el("h2", "", "Weekly Progress & Performance Report"));
            let m = add(cover, el("div", "meta"));
            Object.entries({
               "Reporting week": M.week_num,
               "Data Date": M.data_date,
               "Project ID": M.project_id,
               "Report ID": M.report_id,
            }).forEach(([k, v]) => {
               let z = add(m, el("div"));
               add(z, el("span", "", k));
               add(z, el("strong", "", v));
            });
            const toc = add(root, el("div", "toc"));
            toc.id = "toc";
            add(toc, el("h2", "", "Report contents"));
            let list = add(toc, el("div", "toc-grid"));
            DATA.sections.forEach((s, i) => {
               let isapp = s.id.startsWith("APP-"),
                  label = isapp ? s.id : `${String(i + 1).padStart(2, "0")}`,
                  a = add(list, el("a", "", `${label}   ${s.title}`));
               a.href = "#" + s.id;
               let na = add(nav, el("a", "", `${label}  ${s.title}`));
               na.href = "#" + s.id;
               const sec = add(
                  root,
                  el(
                     "section",
                     "section " +
                        (s.orientation === "landscape" ? "landscape" : ""),
                  ),
               );
               sec.id = s.id;
               const head = add(sec, el("div", "section-head"));
               add(head, el("span", "section-n", s.id));
               let wrap = add(head, el("div"));
               add(wrap, el("h2", "", s.title));
               add(
                  wrap,
                  el(
                     "div",
                     "sub",
                     `${isapp ? "Appendix" : "Report section"} · ${s.processing_status.replace(/_/g, " ")} · ${s.blocks.length} content blocks`,
                  ),
               );
               s.blocks.forEach((b) => renderBlock(sec, b));
               if (s.qualifications?.length) {
                  let foot = add(sec, el("div", "footnotes"));
                  let det = add(foot, el("details"));
                  add(
                     det,
                     el(
                        "summary",
                        "",
                        `Source qualifications (${s.qualifications.length})`,
                     ),
                  );
                  let ul = add(det, el("ul", "bullets"));
                  s.qualifications.forEach((q) => {
                     let text =
                        typeof q === "string"
                           ? q
                           : (q.code ? `${q.code}: ` : "") +
                             (q.message || JSON.stringify(q));
                     add(ul, el("li", "", text));
                  });
               }
            });
         }
         build();
         document.getElementById("search").oninput = (e) => {
            let q = e.target.value.trim().toLowerCase();
            document
               .querySelectorAll(".section")
               .forEach((s) =>
                  s.classList.toggle(
                     "hide",
                     !!q && !s.textContent.toLowerCase().includes(q),
                  ),
               );
         };
         document.getElementById("clear").onclick = () => {
            document.getElementById("search").value = "";
            document
               .querySelectorAll(".section")
               .forEach((s) => s.classList.remove("hide"));
         };
      </script>
   </body>
</html>
